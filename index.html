<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050208"
    >

    <title>Taxi - Snabb taxi i Skåne</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <div class="site-shell">

        <main class="hero-card">

            <!-- Decorative glow -->
            <div class="hero-glow"></div>


            <!-- =========================
                 HEADER
            ========================== -->

            <header class="hero-header">

                <div class="brand-mark">
                    🚕
                </div>

                <div>
                    <p class="eyebrow">
                        TAXI
                    </p>

                    <h1>
                        Taxi
                    </h1>

                    <p class="subtitle signature-text">
                        Snabb taxi i Skåne
                    </p>
                </div>

            </header>


            <!-- =========================
                 CALL PANEL
            ========================== -->

            <section class="call-panel">

                <p class="phone-label">
                    Ring oss direkt
                </p>

                <a
                    class="phone-number"
                    href="tel:+46724474435"
                >
                    072-447 44 35
                </a>

                <a
                    class="call-button"
                    href="tel:+46724474435"
                >
                    <span>☎</span>
                    <span>Ring nu</span>
                </a>

            </section>


            <!-- =========================
                 TAXI ANIMATION
            ========================== -->

            <div class="taxi-track">

                <div class="track-line"></div>

                <div class="taxi-car">
                    🚕
                </div>

            </div>


            <!-- =========================
                 BOOKING FORM
            ========================== -->

            <form
                id="bookingForm"
                class="booking-form"
                novalidate
            >

                <div class="form-heading">

                    <h2 class="signature-heading">
                        Boka en resa
                    </h2>

                    <p>
                        Fyll i uppgifterna nedan för att skicka
                        din taxibokning.
                    </p>

                </div>


                <!-- FROM -->

                <div class="field-group">

                    <label for="from">
                        Från
                    </label>

                    <input
                        id="from"
                        name="from"
                        type="text"
                        placeholder="Upphämtningsadress"
                        autocomplete="street-address"
                        maxlength="120"
                        required
                    >

                </div>


                <!-- TO -->

                <div class="field-group">

                    <label for="to">
                        Till
                    </label>

                    <input
                        id="to"
                        name="to"
                        type="text"
                        placeholder="Destination"
                        maxlength="120"
                        required
                    >

                </div>


                <!-- DATE -->

                <div class="field-group">

                    <label for="date">
                        Datum
                    </label>

                    <input
                        id="date"
                        name="date"
                        type="date"
                        required
                    >

                </div>


                <!-- TIME -->

                <div class="time-grid">

                    <div class="field-group">

                        <label for="hour">
                            Timme
                        </label>

                        <select
                            id="hour"
                            name="hour"
                            required
                        >
                            <option value="">
                                Välj
                            </option>
                        </select>

                    </div>


                    <div class="field-group">

                        <label for="minute">
                            Minuter
                        </label>

                        <select
                            id="minute"
                            name="minute"
                            required
                        >
                            <option value="">
                                Välj
                            </option>
                        </select>

                    </div>

                </div>


                <!-- NAME -->

                <div class="field-group">

                    <label for="name">
                        Namn
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Ditt namn"
                        autocomplete="name"
                        maxlength="80"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="field-group">

                    <label for="phone">
                        Telefonnummer
                    </label>

                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        placeholder="072-123 45 67"
                        autocomplete="tel"
                        maxlength="32"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    id="submitButton"
                    class="submit-button"
                    type="submit"
                >

                    <span class="button-text">
                        Boka resa
                    </span>

                    <span
                        class="button-loader"
                        aria-hidden="true"
                    ></span>

                </button>


                <!-- STATUS -->

                <div
                    id="status"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>


            <!-- =========================
                 FOOTER MESSAGE
                 NO © 2026
            ========================== -->

            <p
                style="
                    margin: 22px 0 0;
                    text-align: center;
                    color: rgba(255,247,253,0.48);
                    font-size: 0.85rem;
                    font-weight: 600;
                "
            >
                Öppet dygnet runt
            </p>

        </main>

    </div>


    <script src="script.js"></script>

</body>
</html>
