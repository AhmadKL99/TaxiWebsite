<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#08050d"
    >

    <meta
        name="description"
        content="Snabb och enkel taxi i Skåne."
    >

    <title>Snabb taxi i Skåne</title>

    <link rel="stylesheet" href="style.css?v=20260820-1">
</head>


<body>

    <!-- =====================================================
         FULL SCREEN BACKGROUND SCENERY
    ====================================================== -->

    <div
        class="background-slideshow"
        aria-hidden="true"
    >

        <div
            class="background-image active"
            style="background-image: url('images/scenery1.jpg');"
        ></div>

        <div
            class="background-image"
            style="background-image: url('images/scenery2.jpg');"
        ></div>

        <div
            class="background-image"
            style="background-image: url('images/scenery3.jpg');"
        ></div>

    </div>


    <!-- Dark cinematic overlay -->

    <div
        class="background-overlay"
        aria-hidden="true"
    ></div>


    <!-- =====================================================
         MAIN WEBSITE
    ====================================================== -->

    <main class="site-shell">

        <section class="hero-card">


            <!-- Decorative glow -->

            <div
                class="hero-glow"
                aria-hidden="true"
            ></div>


            <!-- =================================================
                 HEADER
            ================================================== -->

            <header class="hero-header">

                <div class="brand">

                    <div class="brand-name">
                        TAXI
                    </div>

                    <p class="subtitle">
                        Snabb taxi i Skåne
                    </p>

                </div>

            </header>


            <!-- =================================================
                 CALL PANEL
                 
                 IMPORTANT:
                 Hidden by default.
                 JavaScript shows it ONLY when an error occurs.
            ================================================== -->

            <section
                id="callPanel"
                class="call-panel"
                aria-hidden="true"
            >

                <div class="phone-label">
                    Ring oss direkt
                </div>

                <a
                    class="phone-number"
                    href="tel:+46724474435"
                >
                    072-447 44 35
                </a>

                <a
                    class="call-button glass-button"
                    href="tel:+46724474435"
                >

                    <span class="call-icon">
                        ☎
                    </span>

                    <span>
                        Ring nu
                    </span>

                </a>

            </section>


            <!-- =================================================
                 TAXI TRACK
            ================================================== -->

            <div class="taxi-track">

                <div class="track-line"></div>

                <div class="taxi-car">
                    🚕
                </div>

            </div>


            <!-- =================================================
                 BOOKING FORM
            ================================================== -->

            <form
                id="bookingForm"
                class="booking-form"
                novalidate
            >


                <!-- BOOKING HEADING -->

                <div class="form-heading">

                    <h1>
                        Boka en resa
                    </h1>

                    <p>
                        Fyll i uppgifterna nedan för att
                        skicka din taxibokning.
                    </p>

                </div>


                <!-- FROM -->

                <div class="field-group">

                    <label for="from">
                        Från
                    </label>

                    <input
                        id="from"
                        name="from"
                        type="text"
                        placeholder="Upphämtningsadress"
                        autocomplete="street-address"
                        required
                    >

                </div>


                <!-- TO -->

                <div class="field-group">

                    <label for="to">
                        Till
                    </label>

                    <input
                        id="to"
                        name="to"
                        type="text"
                        placeholder="Destination"
                        required
                    >

                </div>


                <!-- DATE -->

                <div class="field-group">

                    <label for="date">
                        Datum
                    </label>

                    <input
                        id="date"
                        name="date"
                        type="date"
                        required
                    >

                </div>


                <!-- TIME -->

                <div class="time-grid">

                    <div class="field-group">

                        <label for="hour">
                            Timme
                        </label>

                        <select
                            id="hour"
                            name="hour"
                            required
                        >

                            <option value="">
                                Välj
                            </option>

                        </select>

                    </div>


                    <div class="field-group">

                        <label for="minute">
                            Minuter
                        </label>

                        <select
                            id="minute"
                            name="minute"
                            required
                        >

                            <option value="">
                                Välj
                            </option>

                        </select>

                    </div>

                </div>


                <!-- NAME -->

                <div class="field-group">

                    <label for="name">
                        Namn
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Ditt namn"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="field-group">

                    <label for="phone">
                        Telefonnummer
                    </label>

                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        placeholder="072-123 45 67"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- SUBMIT -->

                <button
                    id="submitButton"
                    class="submit-button glass-button"
                    type="submit"
                >

                    <span class="button-text">
                        Boka resa
                    </span>

                    <span class="button-loader"></span>

                </button>


                <!-- STATUS -->

                <div
                    id="status"
                    class="form-message"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>

        </section>

    </main>


    <!-- Cache-busting version -->

    <script src="script.js?v=20260820-1"></script>

</body>

</html>
