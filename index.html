<!DOCTYPE html>

<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

```
<title>Taxi – Boka resa</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<div class="page">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">
            <div class="brand-name">TAXI</div>
            <div class="brand-subtitle">
                Snabb och enkel bokning
            </div>
        </div>

        <a class="call-button" href="tel:+46724474435">
            <span class="call-icon">☎</span>

            <span class="call-text">
                <strong>Ring nu</strong>
                <span>072-447 44 35</span>
            </span>
        </a>

    </header>


    <!-- BOOKING -->
    <main class="main">

        <section class="booking-card">

            <div class="booking-header">
                <h1>Boka en resa</h1>

                <p>
                    Fyll i uppgifterna nedan för att skicka
                    din taxibokning.
                </p>
            </div>


            <form id="bookingForm" novalidate>

                <!-- FROM -->
                <div class="form-group">

                    <label for="from">
                        Från
                    </label>

                    <input
                        id="from"
                        name="from"
                        type="text"
                        placeholder="Upphämtningsadress"
                        autocomplete="street-address"
                        required
                    >

                </div>


                <!-- TO -->
                <div class="form-group">

                    <label for="to">
                        Till
                    </label>

                    <input
                        id="to"
                        name="to"
                        type="text"
                        placeholder="Destination"
                        required
                    >

                </div>


                <!-- DATE -->
                <div class="form-group">

                    <label for="date">
                        Datum
                    </label>

                    <input
                        id="date"
                        name="date"
                        type="date"
                        required
                    >

                </div>


                <!-- TIME -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="hour">
                            Timme
                        </label>

                        <select
                            id="hour"
                            name="hour"
                            required
                        >
                            <option value="">Välj</option>
                        </select>

                    </div>


                    <div class="form-group">

                        <label for="minute">
                            Minuter
                        </label>

                        <select
                            id="minute"
                            name="minute"
                            required
                        >
                            <option value="">Välj</option>
                        </select>

                    </div>

                </div>


                <!-- NAME -->
                <div class="form-group">

                    <label for="name">
                        Namn
                    </label>

                    <input
                        id="name"
                        name="name"
                        type="text"
                        placeholder="Ditt namn"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- PHONE -->
                <div class="form-group">

                    <label for="phone">
                        Telefonnummer
                    </label>

                    <input
                        id="phone"
                        name="phone"
                        type="tel"
                        placeholder="072-123 45 67"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- SUBMIT -->
                <button
                    id="submitButton"
                    class="submit-button"
                    type="submit"
                >
                    Boka resa
                </button>


                <!-- STATUS -->
                <div
                    id="status"
                    class="status"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>

        </section>

    </main>


    <!-- FOOTER -->
    <footer class="footer">

        <div>© 2026 Taxi</div>

        <div>Öppet dygnet runt</div>

    </footer>

</div>


<script src="script.js"></script>
```

</body>
</html>
