```html
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#050805">

    <title>Taxi – Snabb och enkel bokning</title>

    <!-- Prevent browser from displaying a default HTML document icon -->
    <link
        rel="icon"
        type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HERO -->

    <header class="hero">

        <div class="hero-glow"></div>

        <div class="hero-content">

            <div class="logo">
                TAXI
            </div>

            <div class="subtitle">
                Snabb och enkel bokning
            </div>

            <a
                class="phone-button"
                href="tel:+46724474435"
            >
                <span class="phone-icon">📞</span>

                <span>
                    <strong>Ring nu</strong>
                    <small>072-447 44 35</small>
                </span>
            </a>

        </div>

    </header>


    <!-- BOOKING -->

    <main class="main">

        <section class="card">

            <h1>Boka en resa</h1>

            <p class="description">
                Fyll i uppgifterna nedan så återkommer vi med din bokning.
            </p>


            <form id="bookingForm">

                <div class="field">
                    <label for="from">Från</label>

                    <input
                        id="from"
                        type="text"
                        placeholder="Upphämtningsadress"
                        autocomplete="street-address"
                        required
                    >
                </div>


                <div class="field">
                    <label for="to">Till</label>

                    <input
                        id="to"
                        type="text"
                        placeholder="Destination"
                        required
                    >
                </div>


                <div class="field">
                    <label for="date">Datum</label>

                    <input
                        id="date"
                        type="date"
                        required
                    >
                </div>


                <div class="time-row">

                    <div class="field">
                        <label for="hour">Timme</label>

                        <select id="hour" required>
                            <option value="">Timme</option>
                        </select>
                    </div>


                    <div class="field">
                        <label for="minute">Minuter</label>

                        <select id="minute" required>
                            <option value="">Minuter</option>
                        </select>
                    </div>

                </div>


                <div class="field">
                    <label for="name">Namn</label>

                    <input
                        id="name"
                        type="text"
                        placeholder="Ditt namn"
                        autocomplete="name"
                        required
                    >
                </div>


                <div class="field">
                    <label for="phone">Telefonnummer</label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="072-123 45 67"
                        autocomplete="tel"
                        required
                    >
                </div>


                <button
                    id="submitButton"
                    type="submit"
                >
                    Skicka bokning
                </button>


                <div
                    id="status"
                    class="status"
                    aria-live="polite"
                ></div>

            </form>

        </section>

    </main>


    <footer>

        <div>© 2026 Taxi</div>

        <div>Öppet dygnet runt</div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
```
